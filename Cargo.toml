[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
anstyle = "1.0.14"
clap = { version = "4.5.21", features = ["derive"] }
codespan-reporting = "0.13.1"
codespan_preprocessed = { git = "https://github.com/PartyWumpus/codespan_preprocessed.git", branch = "main" }
include_dir = "0.7.4"
indexmap = "2.11.0"
lang-c = { git = "https://github.com/PartyWumpus/lang-c.git", branch = "sauce" }
parking_lot = "0.12.4"
prime_factorization = "1.0.5"
rand = "0.9.2"
strum_macros = "0.28.0"
thiserror = "2.0.12"
walkdir = "2.5.0"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }

[profile.dev]
debug = 0
strip = "debuginfo"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
#cargo = "warn"
clone_on_ref_ptr = "warn"
needless_raw_string_hashes = "allow"
needless_raw_strings = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
